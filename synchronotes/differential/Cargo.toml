[package]
name = "loro-fork-differential"
version = "0.0.0"
edition = "2021"
publish = false

# Not a member of the Loro workspace: it depends on two different `loro`
# packages (the fork by path, stock 1.17.1 from crates.io).
[workspace]

[dependencies]
loro_fork = { package = "loro", path = "../../crates/loro" }
loro_stock = { package = "loro", version = "=1.17.1" }
serde_json = "1"
# For the `fuzz-driver` binary: Loro's own fuzz harness and its oracles,
# driven by random bytes (cargo-fuzz does not work on Windows/MSVC here).
fuzz = { path = "../../crates/fuzz" }
arbitrary = "1"

[profile.release]
debug-assertions = false

# Optimized, but with Loro's debug assertions and tracker self-checks on.
# Used for the fuzz driver: `cargo run --profile checked --bin fuzz-driver`.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

[profile.dev]
opt-level = 1
